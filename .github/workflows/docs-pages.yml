name: docs (Pages)

# Publishes docs/.site to GitHub Pages from the public repository
# (rcludwick/unamblify). It is inert in unamblify-private (the `if:` below):
# Pages is unavailable on private repositories under the free plan. CI still builds the site on
# every push via ci.yml, so a broken page is caught either way.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "ci/build-docs.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false
    # GitHub-hosted: minutes are free on the public repo, and the public repo
    # must never have a self-hosted runner attached (see ci.yml's header).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/configure-pages@v5
      - run: ./ci/build-docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.site

  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
