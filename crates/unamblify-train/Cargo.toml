[package]
name = "unamblify-train"
description = "tch-rs model, losses, loaders, trainer and checkpointing for unamblify. The only crate that links libtorch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# GPU metrics via NVML (`sys/gpu_util`, `sys/gpu_mem_gb`) on CUDA hosts.
cuda = ["dep:nvml-wrapper"]
# GPU metrics via amdgpu sysfs on ROCm hosts.
rocm = ["dep:amdgpu-sysfs"]

[dependencies]
anyhow = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tch = "0.26.0"
thiserror = "2"
toml = "0.9"
unamblify = { path = "../unamblify" }
unamblify-audio = { path = "../unamblify-audio" }

nvml-wrapper = { version = "0.13", optional = true }
amdgpu-sysfs = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"
# Cross-crate shard round trip (tests/shard_roundtrip.rs).
unamblify-data = { path = "../unamblify-data" }

[lints]
workspace = true
