[workspace]
resolver = "2"
members = [
    "crates/unamblify",
    "crates/unamblify-audio",
    "crates/unamblify-data",
    # The only crate that links libtorch; needs `just train-env` first.
    "crates/unamblify-train",
    "crates/unamblify-web",
    # The `unamblify` binary; feature `train` (default) pulls in unamblify-train.
    "crates/unamblify-cli",
    # Vendored MIT/Apache-2.0 island; hard-codes its own metadata and carries no
    # [lints] section on purpose. See vendor/ambe-thumbdv/VENDORED.md.
    # Its `serialport` dependency needs libudev on Linux
    # (`apt install libudev-dev pkg-config`); macOS needs nothing extra.
    "vendor/ambe-thumbdv",
    # Vendored LGPL-3.0-or-later island, reduced to the D-STAR vocoder path;
    # hard-codes its own metadata so it is not relicensed by inheritance.
    # See vendor/ham-digital-modes/VENDORED.md.
    "vendor/ham-digital-modes",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
authors = ["Rob Ludwick <rcludw@gmail.com>"]
repository = "https://github.com/rcludwick/unamblify"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
