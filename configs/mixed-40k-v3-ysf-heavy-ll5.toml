# YSF/DMR-weighted run on the first corpus built after the shard
# builder learned to read FLAC.
#
#   shards mixed-40k-v3   4 modes, 40 k utterances drawn per capture set;
#                         145 636 utterances survived the 2 s minimum and
#                         packed into 270 308 examples (49 GB), train
#                         67 133-67 608 per mode. 0 unjoined.
#                         Every earlier set predates the FLAC move, so this
#                         is the first one to contain any Common Voice or
#                         any capture written since it.
#   [data] mode_weights   ysf-dmr takes the largest share (0.40), then
#                         dstar (0.30), the two Codec 2 modes 0.15 each:
#                         the requested 40/30/15/15 mix, applied to batch
#                         composition rather than to how many utterances
#                         were packed, so it can be retuned without
#                         rebuilding the set. The previous run had this
#                         nearly inverted (dstar 0.30, ysf-dmr 0.15).
#
# YSF/DMR is weighted highest because it is the mode the vocoder damages
# most. Judge on eval/hnr_abs, eval/plosive_* and scripts/mos.py, not on
# eval/lsd, and note LSD is not comparable with earlier runs: the training
# set changed again.

name = "mixed-40k-v3-ysf-heavy-ll5"

[model]
profile = "full"
lookahead = 5
mode_embed = true
noise_head = true
noise_mod = true

[data]
source = "shards"
shards = "mixed-40k-v3"
# Index order must match how the shard set was built
# (--modes ysf-dmr,dstar,codec2-3200,codec2-1600).
modes = ["ysf-dmr", "dstar", "codec2-3200", "codec2-1600"]
# The requested 40/30/15/15 mix, as batch composition.
mode_weights = [0.40, 0.30, 0.15, 0.15]

[train]
steps = 40000
# Pinned, not inherited: configs/default.toml says cpu, and the
# previous run only reached MPS through a per-run override.
device = "mps"
periodicity_w = 0.0
# ~10 % of the total each at the start; read loss/hnr_l1 and
# loss/transient against loss/total in the first few hundred steps.
hnr_w = 0.1
transient_w = 0.03
