# full profile, 5 AMBE frames (100 ms) of lookahead, on the YSF/DMR seed shards
# (the ysf-dmr capture: AMBE+2 2450, the voice bits YSF DN and DMR share).
name = "seed-ysf-dmr-full-ll5"

[model]
profile = "full"
lookahead = 5

[data]
source = "shards"
shards = "seed-ysf-dmr"
mode = "ysf-dmr"

[train]
device = "mps"
